<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Admin | Leaving Egypt</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="login-view" class="login-view">
      <div class="login-card">
        <h1>Leaving Egypt</h1>
        <p class="sub">Sign in to edit website content.</p>
        <div class="err" id="login-err"></div>
        <form id="login-form">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required autofocus />
          <button type="submit" class="btn-primary">Sign in</button>
        </form>
      </div>
    </div>

    <div id="app-view" class="app-view" hidden>
      <header class="topbar">
        <div class="topbar-left">
          <strong>Leaving Egypt</strong>
          <span class="muted">Content Admin</span>
        </div>
        <div class="topbar-right">
          <span id="status" class="status"></span>
          <button type="button" id="btn-save" class="btn-publish" disabled>Save &amp; Publish</button>
          <button type="button" id="btn-logout" class="btn-ghost">Sign out</button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <p class="side-label">Pages</p>
          <nav id="nav"></nav>
        </aside>
        <main class="editor">
          <div id="editor-empty" class="empty">Select a page on the left to edit.</div>
          <div id="editor-panel" hidden>
            <h2 id="editor-title"></h2>
            <p class="hint">Edit the text, then click <strong>Save &amp; Publish</strong> at the top right.</p>
            <form id="editor-form"></form>
          </div>
        </main>
      </div>
    </div>

    <noscript>
      <p style="color:#8b1e1e;text-align:center;padding:2rem">JavaScript is required to sign in.</p>
    </noscript>
    <script src="/admin/admin.js?v=5" defer></script>
  </body>
</html>
